# "minimal" hides the Deploy button and the three-dot options menu in the
# top-right toolbar. Switch back to "auto" (or delete this line) to restore them.
[client]
toolbarMode = "minimal"
# The app renders navigation labels in the selected interface language.
showSidebarNavigation = false

[global]
# Loading a saved job writes each field's value into session state, which
# Streamlit otherwise logs a warning about for every widget that also has a
# default. That pairing is deliberate here (see presets_ui.py).
disableWidgetStateDuplicationWarning = true
