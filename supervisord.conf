; Runs Streamlit and the background worker side by side in one container.
;
; Two processes, one container. This originally existed because
; `create-with-container` ran exactly one container per VM — that command's
; engine (konlet) shut down on 2026-07-31, so it is no longer the reason.
; The arrangement is kept because it is genuinely simpler: one image, one
; `docker compose up`, and the worker cannot be forgotten when starting the
; app. Do NOT restore a create-with-container deployment on the authority of
; the old comment.
;
; Both are autorestart=true. The worker dying is the failure that matters most:
; without it, submitted batches sit in the queue looking healthy forever. A
; restarted worker recovers any job that was mid-flight, resuming from per-item
; state rather than re-rendering from scratch.
;
; This file is dropped into /etc/supervisor/conf.d/ and deliberately declares
; ONLY the two programs. The Debian supervisor package's own
; /etc/supervisor/supervisord.conf supplies [supervisord], [unix_http_server]
; and [supervisorctl] — redeclaring [supervisord] here would collide with it
; and break `supervisorctl`, which the container HEALTHCHECK uses to confirm
; the worker is alive. `nodaemon` comes from the `-n` flag in the Dockerfile
; CMD instead.
;
; stdout_logfile=/dev/stdout sends both programs' output to the container log,
; so `docker logs` shows the UI and the worker interleaved.

[program:streamlit]
command=streamlit run app.py
    --server.port=8501
    --server.address=0.0.0.0
    --server.headless=true
    --server.enableStaticServing=true
    --server.maxUploadSize=2000
directory=/app
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=python -m jobs.worker
directory=/app
autostart=true
autorestart=true
startsecs=5
; A render batch can run 15 minutes. Give the worker time to finish the job it
; is on before it is killed — though if it IS killed, the job is simply
; requeued and resumed, so this is a courtesy rather than a correctness
; requirement.
stopwaitsecs=120
stopasgroup=true
killasgroup=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
